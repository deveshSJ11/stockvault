version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd dashboard
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dashboard/dist
    files:
      - '**/*'
  cache:
    paths:
      - dashboard/node_modules/**/*
env:
  variables:
    VITE_API_BASE: "https://stockvault-backend-env.eba-f37mvakq.ap-south-1.elasticbeanstalk.com"
    VITE_SOCKET_URL: "https://stockvault-backend-env.eba-f37mvakq.ap-south-1.elasticbeanstalk.com"
